name: Release

# Installers for Windows, macOS and Linux, each built on its own system with
# its own bundled Python (frontend/build/prepare_python.py). Push a tag like
# v0.2.0 to publish a release; run it by hand to just build and download them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          # Intel Macs: built on an Intel runner so the bundled Python is x64 too.
          # Just the .zip here -- electron-builder's .dmg step hangs in hdiutil
          # on these runners; the next step tries a .dmg separately.
          - os: macos-15-intel
            target: --mac zip
          - os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Nova's own Python
        run: uv run --no-project --python 3.12 python frontend/build/prepare_python.py
      - name: Keep macOS from holding the disk image open
        # hdiutil (which makes the .dmg) can hang forever on hosted Macs when
        # Spotlight or XProtect grabs the image mid-build.
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          sudo pkill -9 XProtect || true
      - name: Build
        working-directory: frontend
        shell: bash
        timeout-minutes: 45
        env:
          # Signing: see SIGNING.md. With a certificate in the repository's
          # secrets, Macs get a Developer ID signature and are notarized, and
          # Windows installers are signed. Without one, Macs get an ad-hoc
          # signature (build/afterPack.cjs) and Windows is unsigned.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12 || runner.os == 'Windows' && secrets.WIN_CERTIFICATE_PFX || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || runner.os == 'Windows' && secrets.WIN_CERTIFICATE_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12 != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A secret that isn't set arrives as an empty string, which
          # electron-builder takes as "sign with this" -- so drop the empty ones.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          npm ci --no-audit --no-fund
          npm run build
          if [ "$RUNNER_OS" != macOS ]; then
            npx electron-builder ${{ matrix.target }} --publish never
            exit
          fi
          # A stuck hdiutil is killed after 15 minutes and the packaging tried
          # again, rather than the job hanging for hours.
          for attempt in 1 2 3; do
            perl -e 'alarm shift; exec @ARGV' 900 npx electron-builder ${{ matrix.target }} --publish never && exit 0
            echo "Packaging attempt $attempt didn't finish; trying again"
            pkill -9 hdiutil || true
            rm -rf release
          done
          exit 1
      - name: The Mac app's signature holds together
        # A broken signature is what macOS reports as "malware". Check it the
        # way Gatekeeper does, and that the signed app still runs.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(ls -d frontend/release/mac*/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "^(Signature|Authority|TeamIdentifier|CodeDirectory)" || true
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/$(basename "$app" .app)" -e "console.log('signed app runs on', process.arch)"
          spctl -a -vv --type execute "$app" || echo "Gatekeeper: not notarized -- expected until a Developer ID certificate is added (SIGNING.md)"
      - name: The app itself opens and stays open
        # What a user does: open Nova. It must still be running a little later
        # with its engine answering, or the release stops here. On Linux both
        # downloads are tried: the AppImage as is, and the .deb once installed.
        shell: bash
        run: |
          cd frontend/release
          launch() {
            echo "launching: $*"
            "$@" > launch.log 2>&1 &
            local pid=$! alive=0
            for i in $(seq 1 60); do
              sleep 2
              kill -0 $pid 2>/dev/null || break
              curl -sf http://127.0.0.1:8000/health >/dev/null && { alive=1; break; }
            done
            sleep 10
            if [ $alive = 1 ] && kill -0 $pid 2>/dev/null; then
              echo "Nova opened, and its engine answers."
            else
              echo "Nova did not stay open. Its output:"; cat launch.log
              if [ "$RUNNER_OS" = macOS ]; then
                report=$(ls -t ~/Library/Logs/DiagnosticReports/*Nova* 2>/dev/null | head -1)
                [ -n "$report" ] && { echo "--- crash report $report"; head -c 12000 "$report"; }
              fi
              exit 1
            fi
            kill $pid 2>/dev/null || true
            if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM "$(basename "$1")" //T >/dev/null 2>&1 || true; fi
            pkill -f "Nova.app/Contents" 2>/dev/null || true
            pkill -f nova-bin 2>/dev/null || true
            pkill -f "uvicorn app.main:app" 2>/dev/null || true
            sleep 5
          }
          case "$RUNNER_OS" in
            macOS)
              app=$(ls -d mac*/*.app | head -1)
              launch "$app/Contents/MacOS/$(basename "$app" .app)" ;;
            Windows)
              launch "$(ls win-unpacked/*.exe | grep -vi uninstall | head -1)" ;;
            Linux)
              sudo apt-get install -y -qq xvfb >/dev/null
              echo "unprivileged namespaces restricted: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)"
              appimage=$(ls "$PWD"/*.AppImage | head -1); chmod +x "$appimage"
              export APPIMAGE_EXTRACT_AND_RUN=1
              launch xvfb-run -a "$appimage"
              unset APPIMAGE_EXTRACT_AND_RUN
              sudo apt-get install -y -qq "$PWD/$(ls *.deb | head -1)" >/dev/null
              launch xvfb-run -a nova ;;
          esac
      - name: The packaged engine starts
        # From inside the built app, with its own Python, somewhere it was
        # never built: what a user's computer will do on first launch.
        shell: bash
        run: |
          backend=$(cd "$(find frontend/release -type d -path "*esources/backend" | head -1)" && pwd)
          echo "engine at: $backend"
          py="$backend/python/bin/python3"; [ -f "$backend/python/python.exe" ] && py="$backend/python/python.exe"
          cd "$backend"
          "$py" -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > engine.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8765/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/health || { cat engine.log; exit 1; }
          echo
          curl -sf http://127.0.0.1:8765/desktop/status
          echo
          curl -sf http://127.0.0.1:8765/sentinel/status | head -c 400
      - name: The packaged app can check a fix to itself
        # Self-repair keeps a change only if Nova's tests pass, run by the
        # app's own Python -- so the installer must carry both.
        shell: bash
        run: |
          backend=$(cd "$(find frontend/release -type d -path "*esources/backend" | head -1)" && pwd)
          py="$backend/python/bin/python3"; [ -f "$backend/python/python.exe" ] && py="$backend/python/python.exe"
          cd "$backend" && "$py" -m pytest tests -q -p no:cacheprovider -k "self_heal or selfcheck or sentinel"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.os }}
          path: |
            frontend/release/*.exe
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/*.AppImage
            frontend/release/*.deb
          if-no-files-found: error

  intel-dmg:
    # The Intel Mac disk image, with the same window as the Apple-chip one.
    # Made on an Apple-chip runner from the Intel build's .zip: hdiutil hangs
    # when electron-builder runs it on the Intel runners.
    needs: installers
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nova-macos-15-intel
          path: intel
      - name: Build the disk image
        shell: bash
        run: |
          zip=$(ls intel/*-mac.zip | grep -v arm64 | head -1)
          version=$(node -p "require('./frontend/package.json').version")
          mkdir app && ditto -x -k "$zip" app
          python3 -m pip install --quiet --break-system-packages dmgbuild
          cat > settings.py <<'EOF'
          import os
          app = os.environ["APP"]
          files = [app]
          symlinks = {"Applications": "/Applications"}
          format = "UDZO"
          background = "frontend/build/background.png"
          icon_size = 100
          window_rect = ((200, 120), (540, 380))
          icon_locations = {os.path.basename(app): (140, 196), "Applications": (400, 196)}
          show_status_bar = False
          show_tab_view = False
          show_toolbar = False
          show_pathbar = False
          show_sidebar = False
          EOF
          APP="$(ls -d app/*.app | head -1)" perl -e 'alarm shift; exec @ARGV' 900 \
            python3 -m dmgbuild -s settings.py "Nova" "intel/Nova-$version.dmg"
          hdiutil verify "intel/Nova-$version.dmg"
          ls -la intel
      - uses: actions/upload-artifact@v4
        with:
          name: nova-intel-dmg
          path: intel/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installers, intel-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            **Which file is right for your computer, and which computers work:**
            [DEVICES.md](https://github.com/antgshrek08/nova/blob/main/DEVICES.md)

            | Your computer | File |
            |---|---|
            | Windows 10 or 11 | `Nova-Setup-….exe` |
            | Mac with an Apple chip (M1 or newer) | `Nova-…-arm64.dmg` |
            | Mac with an Intel chip | `Nova-….dmg` (the one without `arm64`) |
            | Linux | `Nova-….AppImage` (any distro) or `nova_…_amd64.deb` (Ubuntu, Debian) |

            **First time you open it:** on Windows, if "Windows protected your PC" appears,
            choose **More info > Run anyway**. On a Mac, if macOS says it can't open Nova,
            choose **Done**, then go to **System Settings > Privacy & Security** and click
            **Open Anyway**. On Linux, make the AppImage executable (`chmod +x` on the file).
            These prompts appear because the installers aren't signed with a paid
            certificate yet; see SIGNING.md.

            The first run walks you through setup. See the README for more.
