name: Release

# Installers for Windows, macOS and Linux, each built on its own system with
# its own bundled Python (frontend/build/prepare_python.py). Push a tag like
# v0.2.0 to publish a release; run it by hand to just build and download them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          # Intel Macs: built on an Intel runner so the bundled Python is x64 too.
          - os: macos-15-intel
            target: --mac
          - os: ubuntu-latest
            target: --linux
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Nova's own Python
        run: uv run --no-project --python 3.12 python frontend/build/prepare_python.py
      - name: Build
        working-directory: frontend
        shell: bash
        env:
          # Unsigned until a signing certificate is set up; see README.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx electron-builder ${{ matrix.target }} --publish never
      - name: The packaged engine starts
        # From inside the built app, with its own Python, somewhere it was
        # never built: what a user's computer will do on first launch.
        shell: bash
        run: |
          backend=$(cd "$(find frontend/release -type d -path "*esources/backend" | head -1)" && pwd)
          echo "engine at: $backend"
          py="$backend/python/bin/python3"; [ -f "$backend/python/python.exe" ] && py="$backend/python/python.exe"
          cd "$backend"
          "$py" -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > engine.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8765/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/health || { cat engine.log; exit 1; }
          echo
          curl -sf http://127.0.0.1:8765/desktop/status
          echo
          curl -sf http://127.0.0.1:8765/sentinel/status | head -c 400
      - name: The packaged app can check a fix to itself
        # Self-repair keeps a change only if Nova's tests pass, run by the
        # app's own Python -- so the installer must carry both.
        shell: bash
        run: |
          backend=$(cd "$(find frontend/release -type d -path "*esources/backend" | head -1)" && pwd)
          py="$backend/python/bin/python3"; [ -f "$backend/python/python.exe" ] && py="$backend/python/python.exe"
          cd "$backend" && "$py" -m pytest tests -q -p no:cacheprovider -k "self_heal or selfcheck or sentinel"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.os }}
          path: |
            frontend/release/*.exe
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/*.AppImage
            frontend/release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | Your computer | File |
            |---|---|
            | Windows | the `.exe` |
            | Mac with an Apple chip (M1 or newer) | the `.dmg` with `arm64` in its name (or that `.zip`) |
            | Mac with an Intel chip | the `.dmg` without `arm64` (or that `.zip`) |
            | Linux | `.AppImage` (any distro) or `.deb` (Ubuntu, Debian) |

            These builds aren't code-signed yet. On Windows, if SmartScreen appears, choose
            **More info > Run anyway**. On a Mac, right-click Nova in Applications and choose
            **Open** the first time. On Linux, make the AppImage executable
            (`chmod +x` on the file) before running it.

            The first run walks you through setup. See the README for more.
